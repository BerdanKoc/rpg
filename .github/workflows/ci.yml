name: CI Pipeline

on:
  push:
    branches:
      - dev

# Ajout des permissions nécessaires
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest test/

      - name: Check test results
        if: ${{ success() }}
        run: echo "Tests succeeded!"

      - name: Configure Git
        if: ${{ failure() }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Handle failure
        if: ${{ failure() }}
        run: |
          git stash -u  # Sauvegarde les modifications non commitées
          branch_name="failures/$(date +%s)"
          git checkout -b $branch_name
          git stash pop  # Récupère les modifications
          git add .
          git commit -m "test: failing tests"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $branch_name
          git checkout dev
          git push origin dev --force
          exit 1

  promote-to-master:
    needs: build-and-test
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Promote to master
        run: |
          git checkout main-rpg_base
          git merge dev -m "Merge dev into main-rpg_base"
          git push origin main-rpg_base
